
services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-terrascope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-engine:
    build:
      context: .
      dockerfile: backend/engine/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  node-api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@db:5432/${PGDATABASE:-terrascope}
      - NODE_ENV=production
      - API_PORT=3000
      - PYTHON_ENGINE_URL=http://python-engine:8000
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_MODEL=${SARVAM_MODEL:-sarvam-105b}
      - SENTINEL_HUB_CLIENT_ID=${SENTINEL_HUB_CLIENT_ID:-}
      - SENTINEL_HUB_CLIENT_SECRET=${SENTINEL_HUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      python-engine:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - node-api

volumes:
  postgres_data:
